pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/Rorschach123/PandaGenieSDK")
            credentials {
                username = providers.gradleProperty("gpr.user")
                        .orElse(providers.environmentVariable("GITHUB_ACTOR"))
                        .orNull
                password = providers.gradleProperty("gpr.key")
                        .orElse(providers.environmentVariable("GITHUB_TOKEN"))
                        .orNull
            }
        }
    }
}

rootProject.name = "PandaGenieSDK"
include ':pandagenie-sdk-core'
include ':pandagenie-sdk-provider'
include ':pandagenie-sdk-agent'
include ':pandagenie-sdk'
include ':pandagenie-sdk-demo-provider'
project(':pandagenie-sdk-demo-provider').projectDir = file('examples/provider-demo')
